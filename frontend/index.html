<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MonCherBarre — 발레 AI 비서</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="splash" class="splash">
    <img src="assets/splash.jpg" alt="토슈즈" />
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Mon Cher Barre</span>
    </div>
    <button id="themeToggle" class="theme-toggle" aria-label="다크모드 전환">
      <span class="dot"></span>
    </button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="chat">채팅</button>
    <button class="tab-btn" data-tab="data">데이터</button>
    <button class="tab-btn" data-tab="conversations">대화</button>
  </nav>

  <main class="container">
    <!-- 채팅 섹션 -->
    <section id="chat-section" class="tab-section active">
      <div class="layout">
        <section class="col col-left">
          <div class="hero">
            <img src="assets/hero.jpg" alt="발레 연습 중인 무용수" />
            <div class="hero-caption">
              <p class="eyebrow">Today's Practice</p>
              <h1>침착하게, 다시 한 번</h1>
            </div>
          </div>

          <div class="card summary-card">
            <h2>데이터 요약</h2>
            <p id="summaryText" class="summary-text">불러오는 중…</p>
          </div>

          <div class="card routine-card">
            <h2>루틴 선택</h2>
            <div class="routine-grid">
              <button class="routine-chip" data-min="10">10분</button>
              <button class="routine-chip" data-min="20">20분</button>
              <button class="routine-chip" data-min="30">30분</button>
              <button class="routine-chip" data-min="60">60분</button>
            </div>
          </div>
        </section>

        <section class="col col-right">
          <div class="card chat-card">
            <h2>AI 비서에게 물어보기</h2>
            <div id="chatBox" class="chat-box">
              <div class="msg assistant">안녕하세요, 오늘 연습은 어떠셨나요? 데이터 요약을 참고해서 답해드릴게요.</div>
            </div>
            <div id="loadingRow" class="loading-row hidden">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" type="text" placeholder="예: 오늘 수업 있어?" autocomplete="off" />
              <button type="submit">보내기</button>
            </form>
          </div>
        </section>
      </div>
    </section>

    <!-- 데이터 관리 섹션 -->
    <section id="data-section" class="tab-section">
      <div class="data-container">
        <h2>연습 기록 관리</h2>

        <div class="card data-form-card">
          <h3>새 기록 추가</h3>
          <form id="dataForm" class="data-form">
            <div class="form-group">
              <label>날짜</label>
              <input type="date" id="dataDate" required />
            </div>
            <div class="form-group">
              <label>연습시간 (분)</label>
              <input type="number" id="dataValue" min="0" max="300" required />
            </div>
            <div class="form-group">
              <label>메모 (선택)</label>
              <input type="text" id="dataMemo" placeholder="예: 바레 집중" />
            </div>
            <button type="submit" class="btn-primary">추가</button>
          </form>
        </div>

        <div class="card data-list-card">
          <h3>기록 목록</h3>
          <div id="dataListContainer" class="data-list">
            <p class="loading">불러오는 중…</p>
          </div>
        </div>

        <!-- 통계 카드 -->
        <div class="card stats-card">
          <h3>연습 통계</h3>
          <div class="stats-badges">
            <span class="badge">🔥 연속 <strong id="streakDays">-</strong>일</span>
            <span class="badge">📅 최다 요일: <strong id="bestDay">-</strong>요일</span>
          </div>
          <canvas id="monthlyChart" height="180"></canvas>
        </div>
      </div>
    </section>

    <!-- 대화 기록 섹션 -->
    <section id="conversations-section" class="tab-section">
      <div class="conversations-container">
        <h2>저장된 대화</h2>

        <div class="card conversations-list-card">
          <h3>대화 목록</h3>
          <div id="conversationsListContainer" class="conversations-list">
            <p class="loading">불러오는 중…</p>
          </div>
        </div>

        <div id="conversationDetail" class="card conversation-detail hidden">
          <h3 id="conversationTitle">대화 제목</h3>
          <div id="conversationMessages" class="conversation-messages">
          </div>
          <button class="btn-secondary" onclick="document.getElementById('conversationDetail').classList.add('hidden')">닫기</button>
        </div>
      </div>
    </section>
  </main>

  <!-- config.js를 먼저 로드해야 app.js가 배포 백엔드 주소를 읽는다 -->
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
