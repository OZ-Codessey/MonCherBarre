<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#D4688A"/>
      <stop offset="1" stop-color="#8C2E55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#FFD6E0" stop-opacity=".40"/>
      <stop offset="1" stop-color="#FFD6E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gd" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="460" y2="480">
      <stop offset="0" stop-color="#FFF6E6"/>
      <stop offset=".5" stop-color="#F8DDB0"/>
      <stop offset="1" stop-color="#E2B66E"/>
    </linearGradient>
    <linearGradient id="tutu" gradientUnits="userSpaceOnUse" x1="150" y1="250" x2="390" y2="300">
      <stop offset="0" stop-color="#FFE3EA"/>
      <stop offset="1" stop-color="#F7BFD0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect x="20" y="20" width="472" height="472" rx="8" fill="none" stroke="#F8DDB0" stroke-opacity=".75" stroke-width="2.5"/>
  <rect x="30" y="30" width="452" height="452" rx="5" fill="none" stroke="#F8DDB0" stroke-opacity=".3" stroke-width="1.5"/>

  <!-- 지지하는 다리: 길게, 푸앵트 -->
  <g fill="url(#gd)" stroke="url(#gd)" stroke-width="6" stroke-linejoin="round">
    <path d="M246 252 C 250 330 244 396 236 446 C 235 452 232 462 229 472 C 233 468 238 456 242 448 C 254 396 266 332 274 254 Z"/>
  </g>

  <!-- 상체·뒷다리·치마는 한 덩어리로 위로 올림 (다리가 더 길어 보이게) -->
  <g transform="translate(0 -40)">
    <!-- 뒤로 뻗은 다리 (길게) -->
    <g fill="url(#gd)" stroke="url(#gd)" stroke-width="6" stroke-linejoin="round">
      <path d="M264 288 C 326 282 392 248 446 190 C 454 182 462 176 474 168 C 466 184 456 198 446 208 C 390 268 324 306 274 310 Z"/>
    </g>

    <!-- 치마: 연한 핑크, 다리와 구분되는 와인색 외곽선 -->
    <g transform="rotate(-18 262 292)">
      <path d="M150 301 C 194 288 240 286 264 287 C 302 286 346 290 386 301 C 340 309 196 311 150 301 Z"
            fill="url(#tutu)" stroke="#8C2E55" stroke-opacity=".75" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M180 298 C 220 304 310 304 356 298" fill="none" stroke="#D77FA0" stroke-opacity=".7" stroke-width="2"/>
    </g>

    <!-- 상체: 몸통·목·머리·팔 (허리 기준 0.8배) -->
    <g transform="translate(262 290) scale(0.8) translate(-262 -290)">
      <g fill="url(#gd)" stroke="url(#gd)" stroke-width="6" stroke-linejoin="round">
        <path d="M250 292 C 254 270 256 256 256 242 C 254 224 246 208 246 192 C 247 178 254 164 264 150 C 270 142 276 133 284 124 C 290 119 296 123 294 131 C 291 144 286 154 282 168 C 281 174 281 178 280 184 C 279 202 276 222 270 240 C 268 256 272 274 276 292 Z"/>
        <ellipse cx="298" cy="110" rx="17" ry="19" transform="rotate(28 298 110)"/>
        <circle cx="320" cy="99" r="9"/>
      </g>
      <g fill="none" stroke="url(#gd)" stroke-linecap="round">
        <path d="M248 182 C 194 182 130 164 70 144" stroke-width="13"/>
        <path d="M70 144 C 60 141 52 142 44 146" stroke-width="7"/>
        <path d="M276 188 C 324 186 372 174 414 150" stroke-width="12"/>
        <path d="M414 150 C 424 144 432 138 438 130" stroke-width="7"/>
      </g>
    </g>
  </g>

  <path d="M164 484 Q 236 466 308 484 Q 236 477 164 484 Z" fill="#F8DDB0" fill-opacity=".85"/>
</svg>
