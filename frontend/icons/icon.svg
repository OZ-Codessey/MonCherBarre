  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect x="20" y="20" width="472" height="472" rx="8" fill="none" stroke="#F8DDB0" stroke-opacity=".75" stroke-width="2.5"/>
  <rect x="30" y="30" width="452" height="452" rx="5" fill="none" stroke="#F8DDB0" stroke-opacity=".3" stroke-width="1.5"/>

  <g fill="url(#gd)" stroke="none">
    <!-- 몸통과 목: 하나의 곡선으로 이어져 뒤로 젖혀진 목 -->
    <path d="M250 292 C 254 270 256 256 256 242 C 254 224 246 208 246 192 C 247 178 254 164 264 150 C 270 143 274 139 279 137 C 288 135 293 141 291 149 C 288 161 284 171 280 184 C 279 202 276 222 270 240 C 268 256 272 274 276 292 Z"/>
    <!-- 머리: 턱을 들고 뒤로 젖힘 -->
    <ellipse cx="290" cy="122" rx="16" ry="18" transform="rotate(28 290 122)"/>
    <!-- 쪽머리 -->
    <circle cx="312" cy="112" r="9"/>
    <!-- 지지하는 다리: 푸앵트 -->
    <path d="M246 290 C 250 340 244 396 236 446 C 235 452 232 462 229 472 C 233 468 238 456 242 448 C 254 396 266 340 274 292 Z"/>
    <!-- 뒤로 뻗은 다리 -->
    <path d="M264 288 C 324 282 386 250 440 196 C 447 189 453 184 462 178 C 455 192 447 204 439 212 C 386 268 322 306 274 310 Z"/>
    <!-- 튜튜 -->
    <path d="M138 304 C 182 278 238 270 264 272 C 302 270 346 278 394 304 C 344 328 188 330 138 304 Z" fill-opacity=".96"/>
    <path d="M168 298 C 214 312 318 312 366 298" fill="none" stroke="#C9608A" stroke-opacity=".35" stroke-width="2.5"/>
  </g>

  <g fill="none" stroke="url(#gd)" stroke-linecap="round">
    <!-- 앞으로 뻗은 팔 -->
    <path d="M248 182 C 194 182 130 164 70 144" stroke-width="10"/>
    <path d="M70 144 C 60 141 52 142 44 146" stroke-width="5"/>
    <!-- 뒤로 뻗은 팔 -->
    <path d="M276 188 C 324 186 372 174 414 150" stroke-width="9"/>
    <path d="M414 150 C 424 144 432 138 438 130" stroke-width="5"/>
    <path d="M176 482 C 210 476 262 476 296 482" stroke-width="2.5" stroke="#F8DDB0" stroke-opacity=".8"/>
  </g>
</svg>
